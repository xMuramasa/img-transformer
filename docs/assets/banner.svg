<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="img-transformer: convert, resize and squeeze images">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2029" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1115" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0f1115" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0f1115" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c5a"/>
      <stop offset="0.6" stop-color="#9a4f7a"/>
      <stop offset="1" stop-color="#2a1e46"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="bigClip"><rect x="0" y="0" width="190" height="150" rx="10"/></clipPath>
    <clipPath id="smallClip"><rect x="0" y="0" width="112" height="88" rx="8"/></clipPath>
    <g id="scene">
      <rect width="190" height="150" fill="url(#sunset)"/>
      <circle cx="95" cy="92" r="26" fill="#ffdc96"/>
      <path d="M0 118 L30 100 L58 112 L92 92 L128 110 L160 96 L190 108 V150 H0Z" fill="#46284f"/>
      <path d="M0 132 L36 120 L70 130 L104 116 L140 128 L190 118 V150 H0Z" fill="#2b1a3a"/>
    </g>
  </defs>

  <rect width="1280" height="320" fill="#0f1115"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#fade)"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="140" font-size="64" font-weight="800" fill="#e6e8ee" letter-spacing="-1.5">img<tspan fill="#4f8cff">-</tspan>transformer</text>
    <text x="74" y="186" font-size="21" fill="#8a90a0">Convert, resize and squeeze images: one, many, or a whole zip.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="72" y="218" width="96" height="32" rx="16" fill="#1a1d24" stroke="#2c313d"/>
    <text x="120" y="239" text-anchor="middle" fill="#e6e8ee">FastAPI</text>
    <rect x="180" y="218" width="86" height="32" rx="16" fill="#1a1d24" stroke="#2c313d"/>
    <text x="223" y="239" text-anchor="middle" fill="#e6e8ee">Pillow</text>
    <rect x="278" y="218" width="88" height="32" rx="16" fill="#1a1d24" stroke="#2c313d"/>
    <text x="322" y="239" text-anchor="middle" fill="#e6e8ee">rembg</text>
    <rect x="378" y="218" width="88" height="32" rx="16" fill="#1a1d24" stroke="#2c313d"/>
    <text x="422" y="239" text-anchor="middle" fill="#e6e8ee">Docker</text>
  </g>

  <!-- before: big PNG -->
  <g transform="translate(800 70)">
    <rect x="-1" y="-1" width="192" height="152" rx="11" fill="none" stroke="#2c313d" stroke-width="2"/>
    <g clip-path="url(#bigClip)"><use href="#scene"/></g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
      <rect x="0" y="166" width="190" height="34" rx="8" fill="#1a1d24" stroke="#2c313d"/>
      <text x="14" y="188" fill="#8a90a0">PNG</text>
      <text x="176" y="188" text-anchor="end" fill="#e6e8ee">3000×2000</text>
    </g>
  </g>

  <!-- beam -->
  <g transform="translate(1004 145)">
    <rect x="0" y="-2" width="56" height="4" rx="2" fill="url(#beam)"/>
    <path d="M56 -9 L70 0 L56 9Z" fill="#4f8cff"/>
  </g>

  <!-- after: small WebP -->
  <g transform="translate(1084 101)">
    <rect x="-1" y="-1" width="114" height="90" rx="9" fill="none" stroke="#4f8cff" stroke-width="2"/>
    <g clip-path="url(#smallClip)"><use href="#scene" transform="scale(0.5895 0.5867)"/></g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
      <rect x="0" y="104" width="112" height="34" rx="8" fill="#1a1d24" stroke="#2c313d"/>
      <text x="12" y="126" fill="#8a90a0">WEBP</text>
      <text x="100" y="126" text-anchor="end" fill="#4ade80">1600w</text>
    </g>
  </g>
</svg>
